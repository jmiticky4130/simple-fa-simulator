<!DOCTYPE HTML>
<html>
<head>
  <meta charset="UTF-8">
  <title>DFA/NFA Simulator</title>
  <link rel="icon" href="favicon.ico">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    #elm {
      width: 100vw;
      height: 100vh;
    }

    .elm-btn {
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease;
    }
    .elm-btn:active {
      transform: scale(0.93);
      filter: brightness(0.88);
    }

    @media (max-width: 1289px) {
      .toolbar-btn-label {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="elm"></div>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <script src="elm.js"></script>
  <script>
    var hash = window.location.hash;
    var hashData = null;
    if (hash.startsWith('#a=')) {
      try {
        hashData = LZString.decompressFromEncodedURIComponent(hash.slice(3));
      } catch (e) {
        hashData = null;
      }
    }

    var dark = localStorage.getItem('darkMode') === 'true';
    var lang = localStorage.getItem('language') || 'sk';
    var hasSeenTutorial = localStorage.getItem('hasSeenTutorial') === 'true';
    var gridMode = localStorage.getItem('gridMode') === 'true';

    var app = Elm.Main.init({
      node: document.getElementById('elm'),
      flags: { urlData: hashData, darkMode: dark, language: lang, windowWidth: window.innerWidth, windowHeight: window.innerHeight, hasSeenTutorial: hasSeenTutorial, gridMode: gridMode }
    });

    app.ports.saveTutorialSeen.subscribe(function() {
      localStorage.setItem('hasSeenTutorial', 'true');
    });

    app.ports.saveDarkMode.subscribe(function(v) {
      localStorage.setItem('darkMode', String(v));
    });

    app.ports.saveLanguage.subscribe(function(v) {
      localStorage.setItem('language', v);
    });

    app.ports.saveGridMode.subscribe(function(v) {
      localStorage.setItem('gridMode', String(v));
    });

    app.ports.copyToClipboard.subscribe(function(text) {
      navigator.clipboard.writeText(text).catch(function() {});
    });

    app.ports.scrollToBottom.subscribe(function(elementId) {
      requestAnimationFrame(function() {
        var el = document.getElementById(elementId);
        if (el) { el.scrollTop = el.scrollHeight; }
      });
    });

    app.ports.setUrlHash.subscribe(function(payload) {
      var compressed = LZString.compressToEncodedURIComponent(payload);
      window.location.hash = 'a=' + compressed;
      navigator.clipboard.writeText(window.location.href).catch(function() {});
    });

    var STORAGE_KEY = 'automata_list';

    function getStoredList() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch(e) { return []; }
    }

    app.ports.saveNamedAutomaton.subscribe(function(entry) {
      var list = getStoredList();
      var idx = list.findIndex(function(e) { return e.name === entry.name; });
      if (idx >= 0) { list[idx] = entry; } else { list.push(entry); }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    });

    app.ports.deleteNamedAutomaton.subscribe(function(name) {
      var list = getStoredList();
      var filtered = list.filter(function(e) { return e.name !== name; });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered));
    });

    app.ports.requestStoredAutomata.subscribe(function() {
      app.ports.storedAutomataLoaded.send(getStoredList());
    });
  </script>
</body>
</html>
